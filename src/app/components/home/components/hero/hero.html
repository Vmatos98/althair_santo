<section id="home" class="hero-section relative flex items-center justify-center">
    <!-- Video Background -->
    <video #videoPlayer 
           class="hero-video" 
           autoplay 
           [muted]="true" 
           muted 
           loop 
           playsinline 
           preload="auto"
           [style.opacity]="videoOpacity">
        <source src="assets/content/logo.mp4" type="video/mp4">
        Seu navegador não suporta vídeos.
    </video>

    <!-- Overlay -->
    <div class="hero-overlay"></div>

    <!-- Content (Hero Logo - Estrutura idêntica à intro para sobreposição perfeita) -->
    <div class="text-center px-4 flex flex-col items-center justify-center hero-content-wrapper" style="z-index: 2;">
        <!-- Desktop / Tablet Horizontal Logo -->
        <div class="hidden md:flex justify-center items-center w-full max-w-[540px] lg:max-w-[660px] hero-logo-box">
            <img src="assets/content/logo_intro_desktop.png" 
                 alt="Althair Santo" 
                 class="w-full h-auto object-contain hero-logo-img">
        </div>

        <!-- Mobile Vertical Logo -->
        <div class="flex md:hidden justify-center items-center w-full max-w-[220px] sm:max-w-[260px] hero-logo-box">
            <img src="assets/content/logo_intro_mobile.png" 
                 alt="Althair Santo" 
                 class="w-full h-auto object-contain hero-logo-img">
        </div>

        <h1 class="sr-only">Althair Santo - Estilista e Designer de Moda Autoral</h1>
    </div>

    <!-- Scroll Arrow -->
    <div class="scroll-down-arrow">
        <a href="#sobre" class="text-white text-3xl" aria-label="Rolar para baixo para a seção Sobre">
            <i class="fas fa-chevron-down"></i>
        </a>
    </div>
</section>
